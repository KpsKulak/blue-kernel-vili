name: Build Blue Kernel vili (kpsTechXecl)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Blue Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ccache automake flex lzop bison bc build-essential zip curl \
            zlib1g-dev libxml2-utils bzip2 libbz2-dev libssl-dev python3 \
            libncurses5 binutils-aarch64-linux-gnu

      - name: Download AOSP Clang
        run: |
          git clone --depth=1 https://gitlab.com/tejassinggh/clang-r450784d.git clang

      - name: Clone LineageOS SM8350 (Full Recursive)
        run: |
          git clone --depth=1 --recurse-submodules https://github.com/LineageOS/android_kernel_xiaomi_sm8350.git -b lineage-24.0 kernel

      - name: Integrate KernelSU-Next & Set Brand
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          echo 'CONFIG_LOCALVERSION="-kpsTechXecl"' >> arch/arm64/configs/vendor/lahaina-perf_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/lahaina-perf_defconfig
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/vendor/lahaina-perf_defconfig

      - name: Build Kernel Image & DTBs
        run: |
          cd kernel
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          # 1. Base Snapdragon 888 config
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/lahaina-perf_defconfig

          # 2. Merge Xiaomi board config
          if [ -f arch/arm64/configs/vendor/xiaomi/sm8350.config ]; then
            ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out \
              out/.config \
              arch/arm64/configs/vendor/xiaomi/sm8350.config
            make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig
          fi

          # 3. Full build of kernel Image and device tree blobs
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.gz-dtb Image dtbs

          # 4. Strict sanity check on kernel binary size
          SIZE=$(stat -c%s "out/arch/arm64/boot/Image" 2>/dev/null || echo 0)
          echo "Generated Image size: $SIZE bytes"
          if [ "$SIZE" -lt 15000000 ]; then
            echo "ERROR: Kernel Image is too small ($SIZE bytes), incomplete build!"
            exit 1
          fi

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/0mar99/AnyKernel3.git AK3

          # Copy Image
          cp kernel/out/arch/arm64/boot/Image AK3/

          # Concatenate and package SM8350 DTBs
          find kernel/out/arch/arm64/boot/dts/vendor/qcom/ -name "*.dtb" -exec cat {} + > AK3/dtb 2>/dev/null || true
          if [ ! -s AK3/dtb ] && [ -f kernel/out/arch/arm64/boot/dtb ]; then
            cp kernel/out/arch/arm64/boot/dtb AK3/
          fi

          # AnyKernel3 parameters for vili
          sed -i 's/device.name1=.*/device.name1=vili/' AK3/anykernel.sh
          sed -i 's/BLOCK=.*/BLOCK=boot;/' AK3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=auto;/' AK3/anykernel.sh

          cd AK3
          zip -r9 ../BlueKernel-vili-kpsTechXecl.zip * -x .git README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueKernel-vili-kpsTechXecl
          path: BlueKernel-vili-kpsTechXecl.zip
