name: Build Blue Kernel vili (kpsTechXecl)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Blue Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison \
            bc build-essential zip curl zlib1g-dev g++-multilib \
            libxml2-utils bzip2 libbz2-dev libssl-dev python3 libncurses5

      - name: Download AOSP Clang (r450784d)
        run: |
          mkdir -p clang
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-13.0.0_r0.13/clang-r450784d.tar.gz
          tar -C clang/ -zxf clang-r450784d.tar.gz
          rm clang-r450784d.tar.gz

      - name: Clone LineageOS SM8350 (lineage-24.0)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_sm8350.git -b lineage-24.0 kernel

      - name: Integrate KernelSU-Next & Set Brand
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          echo 'CONFIG_LOCALVERSION="-kpsTechXecl"' >> arch/arm64/configs/vendor/lahaina-perf_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/lahaina-perf_defconfig
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/vendor/lahaina-perf_defconfig

      - name: Build Kernel Image & DTB
        run: |
          cd kernel
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # Defconfig for vili
          make O=out vendor/lahaina-perf_defconfig
          if [ -f arch/arm64/configs/vendor/xiaomi/sm8350.config ]; then
            make O=out vendor/xiaomi/sm8350.config
          fi

          # Build Image and dtb targets
          make -j$(nproc --all) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            Image dtb

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/0mar99/AnyKernel3.git AK3
          cp kernel/out/arch/arm64/boot/Image AK3/
          if [ -f kernel/out/arch/arm64/boot/dtb ]; then
            cp kernel/out/arch/arm64/boot/dtb AK3/
          fi

          sed -i 's/device.name1=.*/device.name1=vili/' AK3/anykernel.sh
          sed -i 's/BLOCK=.*/BLOCK=boot;/' AK3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=auto;/' AK3/anykernel.sh

          cd AK3
          zip -r9 ../BlueKernel-vili-kpsTechXecl.zip * -x .git README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueKernel-vili-kpsTechXecl
          path: BlueKernel-vili-kpsTechXecl.zip
